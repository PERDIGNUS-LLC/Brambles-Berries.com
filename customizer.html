<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brambles & Berries Customizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="container">
      <img class="logo-image" src="images/logo.png" alt="Brambles & Berries Logo">
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="customizer.html" class="active">Customizer</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div id="customizer">

      <!-- LEFT: Preview -->
      <div class="preview">
        <img id="base-image" src="images/customizer/bases/watermelon.png" alt="Base">
        <img id="eyes-image" src="images/customizer/eyes/eyes1.png" alt="Eyes" style="display:none">
        <img id="mouth-image" src="images/customizer/mouth/mouth1.png" alt="Mouth" style="display:none">

        <button id="add-to-cart">Add to Cart</button>
      </div>

      <!-- MIDDLE: Selectors -->
      <div class="selectors">
        <div class="customizer-section">
          <h3>Base</h3>
          <div id="base-selector" class="selector-grid"></div>
        </div>

        <div class="customizer-section">
          <h3>Eyes</h3>
          <div id="eyes-selector" class="selector-grid"></div>
        </div>

        <div class="customizer-section">
          <h3>Mouth</h3>
          <div id="mouth-selector" class="selector-grid"></div>
        </div>
      </div>

      <!-- RIGHT (Desktop) / BOTTOM (Mobile): Upload Panel -->
      <aside class="upload-panel" id="upload-panel">
        <h3>Upload Your Stool<br>(Optional)</h3>

        <input type="file" id="upload-base" accept="image/*">

        <div class="upload-tools" id="upload-tools" style="display:none;">
          <button type="button" id="base-reset">Reset Photo</button>

          <div class="zoom-row">
            <button type="button" id="base-zoom-out" aria-label="Zoom out">−</button>
            <button type="button" id="base-zoom-in" aria-label="Zoom in">+</button>
          </div>
        </div>

        <p class="hint" id="upload-hint" style="display:none;">
          Tip: drag the photo to position it.<br>
          Scroll to zoom (desktop).
        </p>

        <p class="fineprint">
          This photo is for reference only. Final product may vary.
        </p>

        <div class="cart-status" id="cart-status"></div>
        <button type="button" id="clear-cart" class="clear-cart">Clear Cart</button>
      </aside>

    </div>
  </main>

  <footer class="main-footer">
    <p>&copy; 2025 Brambles & Berries</p>
  </footer>

  <script src="customizer.js"></script>
</body>
</html>
