<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brambles & Berries Customizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="customizer">
    <div class="preview">
      <img id="base-image" src="images/customizer/bases/watermelon.png" alt="Base">
      <img id="eyes-image" src="" alt="Eyes" style="display:none">
      <img id="mouth-image" src="" alt="Mouth" style="display:none">
    </div>

    <div class="selectors">
      <div class="customizer-section">
        <h3>Base</h3>
        <div id="base-selector" class="selector-grid"></div>
      </div>

      <div class="customizer-section">
        <h3>Eyes</h3>
        <div id="eyes-selector" class="selector-grid"></div>
      </div>

      <div class="customizer-section">
        <h3>Mouth</h3>
        <div id="mouth-selector" class="selector-grid"></div>
      </div>
    </div>

    <button id="add-to-cart">Add to Cart</button>
  </div>

  <script src="customizer.js"></script>
</body>
</html>
