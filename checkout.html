<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout – Brambles & Berries</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Modern, organized form layout */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #4a5d23; /* Darker green for Brambles theme */
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Distinctive color for the final payment button */
        #continueToPayment {
            background-color: #2e7d32 !important; /* Bold Forest Green */
            color: white;
            font-weight: bold;
            border: 2px solid #1b5e20;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #continueToPayment:hover {
            background-color: #1b5e20 !important;
        }

        /* Adjust the general button style for visibility */
        .btn {
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:480px; margin:40px auto; padding: 20px; background: #fffcf5; border-radius: 8px;">
        <h2 style="color: #4a5d23;">Shipping Information</h2>
        <p>Please enter your shipping address so we can calculate the exact shipping cost.</p>

        <form id="shippingForm" autocomplete="on">
            <div class="form-group">
                <label for="street1">Street Address</label>
                <input type="text" id="street1" required autocomplete="address-line1" />
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" required autocomplete="address-level2" />
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="state">State</label>
                    <input type="text" id="state" required autocomplete="address-level1" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="zip">ZIP Code</label>
                    <input type="text" id="zip" required autocomplete="postal-code" />
                </div>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" value="US" required autocomplete="country" />
            </div>

            <button class="btn" type="submit" style="margin-top:10px; width: 100%;">
                Get Shipping Rates
            </button>
        </form>

        <div id="ratesContainer" style="margin-top:30px; display:none;">
            <h3 style="color: #4a5d23;">Select a Shipping Method</h3>
            <div id="ratesList"></div>
        </div>

        <button id="continueToPayment" class="btn" style="width:100%; margin-top:20px; display:none;">
            Continue to Payment
        </button>
    </div>

    <script src="cart-logic.js"></script>
    <script>
    const US_STATE_ABBREVS = {
        "ALABAMA": "AL", "ALASKA": "AK", "ARIZONA": "AZ", "ARKANSAS": "AR", "CALIFORNIA": "CA",
        "COLORADO": "CO", "CONNECTICUT": "CT", "DELAWARE": "DE", "FLORIDA": "FL", "GEORGIA": "GA",
        "HAWAII": "HI", "IDAHO": "ID", "ILLINOIS": "IL", "INDIANA": "IN", "IOWA": "IA",
        "KANSAS": "KS", "KENTUCKY": "KY", "LOUISIANA": "LA", "MAINE": "ME", "MARYLAND": "MD",
        "MASSACHUSETTS": "MA", "MICHIGAN": "MI", "MINNESOTA": "MN", "MISSISSIPPI": "MS", "MISSOURI": "MO",
        "MONTANA": "MT", "NEBRASKA": "NE", "NEVADA": "NV", "NEW HAMPSHIRE": "NH", "NEW JERSEY": "NJ",
        "NEW MEXICO": "NM", "NEW YORK": "NY", "NORTH CAROLINA": "NC", "NORTH DAKOTA": "ND", "OHIO": "OH",
        "OKLAHOMA": "OK", "OREGON": "OR", "PENNSYLVANIA": "PA", "RHODE ISLAND": "RI", "SOUTH CAROLINA": "SC",
        "SOUTH DAKOTA": "SD", "TENNESSEE": "TN", "TEXAS": "TX", "UTAH": "UT", "VERMONT": "VT",
        "VIRGINIA": "VA", "WASHINGTON": "WA", "WEST VIRGINIA": "WV", "WISCONSIN": "WI", "WYOMING": "WY"
    };

    document.addEventListener("DOMContentLoaded", () => {
        let selectedRate = null;
        let shippingData = null;

        const shippingForm   = document.getElementById("shippingForm");
        const ratesContainer = document.getElementById("ratesContainer");
        const ratesList      = document.getElementById("ratesList");
        const continueBtn    = document.getElementById("continueToPayment");

        function buildAndNormalizeAddress() {
            let street  = document.getElementById("street1").value.trim();
            let city    = document.getElementById("city").value.trim();
            let state   = document.getElementById("state").value.trim();
            let zip     = document.getElementById("zip").value.trim();
            let country = document.getElementById("country").value.trim();

            let upperState = state.toUpperCase();
            if (upperState.length > 2 && US_STATE_ABBREVS[upperState]) {
                upperState = US_STATE_ABBREVS[upperState];
            }

            let upperCountry = country.toUpperCase();
            if (["UNITED STATES", "UNITED STATES OF AMERICA", "USA"].includes(upperCountry)) {
                upperCountry = "US";
            }

            return { street1: street, city, state: upperState, zip, country: upperCountry || "US" };
        }

        if (shippingForm) {
            shippingForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                shippingData = buildAndNormalizeAddress();

                if (!/^\d{5}(-\d{4})?$/.test(shippingData.zip)) {
                    alert("Please enter a valid ZIP code.");
                    return;
                }

                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");
                if (!cart.length) {
                    alert("Your cart is empty.");
                    return;
                }

                const largestSize = cart.some(i => i.size === "L") ? "L" : "S";

                const res = await fetch("/api/get-shipping-rates", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        customerAddress: shippingData,
                        product: { size: largestSize }
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert("Could not calculate shipping: " + (data.error || "Unknown error"));
                    return;
                }

                const rates = Array.isArray(data) ? data : [];
                ratesList.innerHTML = "";
                ratesContainer.style.display = "block";

                rates.forEach((rate) => {
                    const btn = document.createElement("button");
                    btn.textContent = `${rate.carrier} ${rate.service} — $${rate.rate}`;
                    btn.className = "btn";
                    btn.style.display = "block";
                    btn.style.width = "100%";
                    btn.style.margin = "10px 0";

                    btn.onclick = () => {
                        selectedRate = rate;
                        continueBtn.style.display = "block";
                        [...ratesList.children].forEach(el => el.style.background = "");
                        btn.style.background = "#d6ffd6";
                    };
                    ratesList.appendChild(btn);
                });
            });
        }

        if (continueBtn) {
            continueBtn.addEventListener("click", async () => {
                if (!selectedRate || !shippingData) {
                    alert("Please select a shipping method.");
                    return;
                }

                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");
                const res = await fetch("/api/create-checkout-session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cart,
                        shippingRate: selectedRate,
                        address: shippingData
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert("Checkout error: " + (data.error || "Unknown error"));
                    return;
                }
                window.location.href = data.url;
            });
        }
    });
    </script>
</body>
</html>
