<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout – Brambles & Berries</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container" style="max-width:480px;margin:40px auto;">
        <h2>Shipping Information</h2>
        <p>Please enter your shipping address so we can calculate the exact shipping cost.</p>

        <form id="shippingForm">
            <label>Street Address</label>
            <input type="text" id="street1" required />

            <label>City</label>
            <input type="text" id="city" required />

            <label>State</label>
            <input type="text" id="state" required />

            <label>ZIP Code</label>
            <input type="text" id="zip" required />

            <label>Country</label>
            <input type="text" id="country" value="US" required />

            <button class="btn" type="submit" style="margin-top:20px;">
                Get Shipping Rates
            </button>
        </form>

        <div id="ratesContainer" style="margin-top:30px; display:none;">
            <h3>Select a Shipping Method</h3>
            <div id="ratesList"></div>
        </div>

        <button id="continueToPayment" class="btn"
            style="width:100%;margin-top:20px;display:none;">
            Continue to Payment
        </button>
    </div>

    <!-- Keep your existing cart logic; it's safe here -->
    <script src="cart-logic.js"></script>

    <!-- Shipping + Checkout logic -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        let selectedRate = null;
        let shippingData = null;

        const shippingForm = document.getElementById("shippingForm");
        const ratesContainer = document.getElementById("ratesContainer");
        const ratesList = document.getElementById("ratesList");
        const continueBtn = document.getElementById("continueToPayment");

        // When the shipping form is submitted:
        if (shippingForm) {
            shippingForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                // Collect address
                shippingData = {
                    street1: document.getElementById("street1").value.trim(),
                    city: document.getElementById("city").value.trim(),
                    state: document.getElementById("state").value.trim(),
                    zip: document.getElementById("zip").value.trim(),
                    country: document.getElementById("country").value.trim(),
                };

                // Load cart from storage
                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");
                if (!cart.length) {
                    alert("Your cart is empty.");
                    return;
                }

                // Request rates (match API expectations: customerAddress + product)
                const res = await fetch("/api/get-shipping-rates", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        customerAddress: shippingData,
                        product: cart[0]       // use first item for size-based shipping
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert("Could not calculate shipping: " + (data.error || "Unknown error"));
                    return;
                }

                const rates = Array.isArray(data) ? data : [];

                // Show rate options
                ratesList.innerHTML = "";
                ratesContainer.style.display = "block";

                rates.forEach((rate) => {
                    const btn = document.createElement("button");
                    btn.textContent = `${rate.carrier} ${rate.service} — $${rate.rate}`;
                    btn.className = "btn";
                    btn.style.display = "block";
                    btn.style.margin = "10px 0";

                    btn.onclick = () => {
                        selectedRate = rate;
                        continueBtn.style.display = "block";

                        // Highlight selection
                        [...ratesList.children].forEach(el => el.style.background = "");
                        btn.style.background = "#d6ffd6";
                    };

                    ratesList.appendChild(btn);
                });
            });
        }

        // When the user chooses a rate and wants to pay:
        if (continueBtn) {
            continueBtn.addEventListener("click", async () => {
                if (!selectedRate || !shippingData) {
                    alert("Please select a shipping method.");
                    return;
                }

                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");

                const res = await fetch("/api/create-checkout-session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cart,
                        shippingRate: selectedRate,
                        address: shippingData
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert("Checkout error: " + (data.error || "Unknown error"));
                    return;
                }

                window.location.href = data.url; // send to Stripe
            });
        }
    });
    </script>
</body>
</html>
