<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout – Brambles & Berries</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container" style="max-width:480px;margin:40px auto;">
        <h2>Shipping Information</h2>
        <p>Please enter your shipping address so we can calculate the exact shipping cost.</p>

        <form id="shippingForm" autocomplete="off">
            <label>Street Address</label>
            <!-- This field gets Google Places autocomplete -->
            <input type="text" id="street1" required />

            <label>City</label>
            <input type="text" id="city" required />

            <label>State</label>
            <!-- We’ll fill this with 2-letter codes like WI, CA, etc. -->
            <input type="text" id="state" required />

            <label>ZIP Code</label>
            <input type="text" id="zip" required />

            <label>Country</label>
            <input type="text" id="country" value="US" required />

            <button class="btn" type="submit" style="margin-top:20px;">
                Get Shipping Rates
            </button>
        </form>

        <div id="ratesContainer" style="margin-top:30px; display:none;">
            <h3>Select a Shipping Method</h3>
            <div id="ratesList"></div>
        </div>

        <button id="continueToPayment" class="btn"
            style="width:100%;margin-top:20px;display:none;">
            Continue to Payment
        </button>
    </div>

    <!-- Your existing cart logic (unchanged) -->
    <script src="cart-logic.js"></script>

    <!-- Google Places API (replace YOUR_API_KEY_HERE) -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places&callback=initAddressAutocomplete"
      async
      defer
    ></script>

    <script>
    // Called by Google script once Places library is loaded
    function initAddressAutocomplete() {
        const streetInput = document.getElementById("street1");
        if (!streetInput || !window.google || !google.maps.places) return;

        const autocomplete = new google.maps.places.Autocomplete(streetInput, {
            types: ["address"],
            componentRestrictions: { country: "us" }
        });

        autocomplete.addListener("place_changed", () => {
            const place = autocomplete.getPlace();
            if (!place || !place.address_components) return;

            let streetNumber = "";
            let route = "";
            let city = "";
            let state = "";
            let postalCode = "";
            let country = "";

            place.address_components.forEach((comp) => {
                const types = comp.types || [];
                if (types.includes("street_number")) {
                    streetNumber = comp.long_name;
                }
                if (types.includes("route")) {
                    route = comp.long_name;
                }
                if (types.includes("locality")) {
                    city = comp.long_name;
                }
                if (types.includes("administrative_area_level_1")) {
                    // short_name gives "WI" instead of "Wisconsin"
                    state = comp.short_name;
                }
                if (types.includes("postal_code")) {
                    postalCode = comp.long_name;
                }
                if (types.includes("country")) {
                    country = comp.short_name; // "US"
                }
            });

            const streetField = document.getElementById("street1");
            const cityField   = document.getElementById("city");
            const stateField  = document.getElementById("state");
            const zipField    = document.getElementById("zip");
            const countryField= document.getElementById("country");

            if (streetField)  streetField.value  = [streetNumber, route].filter(Boolean).join(" ");
            if (cityField)    cityField.value    = city;
            if (stateField)   stateField.value   = state;
            if (zipField)     zipField.value     = postalCode;
            if (countryField) countryField.value = country || "US";
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        let selectedRate = null;
        let shippingData = null;

        const shippingForm   = document.getElementById("shippingForm");
        const ratesContainer = document.getElementById("ratesContainer");
        const ratesList      = document.getElementById("ratesList");
        const continueBtn    = document.getElementById("continueToPayment");

        // When the shipping form is submitted:
        if (shippingForm) {
            shippingForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                // Collect address (state will now be an abbreviation like "WI")
                shippingData = {
                    street1: document.getElementById("street1").value.trim(),
                    city:    document.getElementById("city").value.trim(),
                    state:   document.getElementById("state").value.trim(),
                    zip:     document.getElementById("zip").value.trim(),
                    country: document.getElementById("country").value.trim(),
                };

                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");
                if (!cart.length) {
                    alert("Your cart is empty.");
                    return;
                }

                const res = await fetch("/api/get-shipping-rates", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        customerAddress: shippingData,
                        product: cart[0] // first item, for size-based shipping
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert("Could not calculate shipping: " + (data.error || "Unknown error"));
                    return;
                }

                const rates = Array.isArray(data) ? data : [];

                ratesList.innerHTML = "";
                ratesContainer.style.display = "block";

                rates.forEach((rate) => {
                    const btn = document.createElement("button");
                    btn.textContent = `${rate.carrier} ${rate.service} — $${rate.rate}`;
                    btn.className = "btn";
                    btn.style.display = "block";
                    btn.style.margin = "10px 0";

                    btn.onclick = () => {
                        selectedRate = rate;
                        continueBtn.style.display = "block";

                        [...ratesList.children].forEach(el => el.style.background = "");
                        btn.style.background = "#d6ffd6";
                    };

                    ratesList.appendChild(btn);
                });
            });
        }

        // When the user chooses a rate and wants to pay:
        if (continueBtn) {
            continueBtn.addEventListener("click", async () => {
                if (!selectedRate || !shippingData) {
                    alert("Please select a shipping method.");
                    return;
                }

                const cart = JSON.parse(localStorage.getItem("bb_cart_items") || "[]");

                const res = await fetch("/api/create-checkout-session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cart,
                        shippingRate: selectedRate,
                        address: shippingData
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert("Checkout error: " + (data.error || "Unknown error"));
                    return;
                }

                window.location.href = data.url; // send to Stripe
            });
        }
    });
    </script>
</body>
</html>
